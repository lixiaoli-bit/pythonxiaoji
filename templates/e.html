<!DOCTYPE html>
<html>
<head>
  <!-- 1. 引入 ECharts -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>
  <!-- 2. 准备容器 -->
  <div id="myChart" style="width: 600px; height: 400px;"></div>

  <script>
    // 3. 初始化
    var chart = echarts.init(document.getElementById('myChart'));
    
    // 4. 配置 (重点)
    var option = {
    title: { text: '销量占比' },  // 标题
    tooltip: {},                 // 提示框
    series: [{
        name: '销量',
        type: 'pie',             // 关键：改成 pie
        radius: '50%',           // 饼图半径
        data: [                  // 注意：饼图的数据格式变了
            { value: 50, name: '苹果' },
            { value: 80, name: '香蕉' },
            { value: 30, name: '橘子' }
        ]
    }]
};
    
    // 5. 显示图表
    chart.setOption(option);
  </script>
</body>
</html>
