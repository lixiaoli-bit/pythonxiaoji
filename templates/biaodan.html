<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单表单 · id 姓名 年龄 sex 邮箱</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
        }
        body {
            background: linear-gradient(145deg, #f5f7fc 0%, #e9eef4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 1.5rem;
            margin: 0;
        }
        .card {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 40px;
            padding: 2.2rem 2rem 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 10, 30, 0.15), 0 6px 12px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        h2 {
            font-size: 1.9rem;
            font-weight: 600;
            color: #0b1a33;
            letter-spacing: -0.02em;
            margin-bottom: 0.15rem;
        }
        .subhead {
            font-size: 0.95rem;
            color: #4a5b74;
            border-left: 3px solid #7c8db0;
            padding-left: 14px;
            margin-top: -0.2rem;
            margin-bottom: 2rem;
            font-weight: 400;
            background: rgba(220, 230, 245, 0.2);
            border-radius: 0 12px 12px 0;
            line-height: 1.4;
        }
        .form-group {
            margin-bottom: 1.6rem;
        }
        label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            font-size: 0.9rem;
            letter-spacing: 0.02em;
            color: #1f2b40;
            margin-bottom: 6px;
        }
        label i {
            font-style: normal;
            font-size: 1.1rem;
        }
        .field {
            width: 100%;
            padding: 0.8rem 1rem;
            font-size: 1rem;
            background: white;
            border: 1.5px solid #d6dee9;
            border-radius: 20px;
            transition: 0.2s;
            color: #0e1a2b;
            font-weight: 450;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.01);
        }
        .field:focus {
            outline: none;
            border-color: #3a6b9e;
            box-shadow: 0 0 0 4px rgba(58, 107, 158, 0.15), inset 0 2px 6px rgba(0,0,0,0.02);
        }
        .field::placeholder {
            color: #a6b6ce;
            font-weight: 350;
            font-size: 0.9rem;
        }
        .radio-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1.8rem 1.2rem;
            background: rgba(235, 242, 250, 0.3);
            padding: 0.5rem 1.2rem 0.5rem 1.2rem;
            border-radius: 40px;
            border: 1px solid #d6dee9;
        }
        .radio-option {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            cursor: pointer;
            font-size: 0.98rem;
            color: #1f2b40;
        }
        .radio-option input[type="radio"] {
            appearance: none;
            width: 1.2rem;
            height: 1.2rem;
            border: 2px solid #b2c2da;
            border-radius: 50%;
            margin: 0;
            background: white;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .radio-option input[type="radio"]:checked {
            border-color: #1f4b7a;
            background-color: #1f4b7a;
            box-shadow: inset 0 0 0 4px white, 0 0 0 1px #1f4b7a;
        }
        .radio-option input[type="radio"]:focus {
            outline: 2px solid #8aa9d1;
            outline-offset: 2px;
        }
        .btn-submit {
            background: #1f3b5c;
            border: none;
            color: white;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 0.9rem 1.8rem;
            border-radius: 40px;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
            letter-spacing: 0.4px;
            box-shadow: 0 6px 12px rgba(26, 55, 94, 0.2);
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-submit:hover {
            background: #143049;
            transform: scale(1.01);
            box-shadow: 0 10px 18px rgba(20, 48, 73, 0.25);
        }
        .btn-submit:active {
            transform: scale(0.97);
            background: #0f243a;
        }
        .note {
            margin-top: 1.2rem;
            font-size: 0.78rem;
            color: #5f738f;
            text-align: center;
            border-top: 1px dashed #cdd9e9;
            padding-top: 1.2rem;
            letter-spacing: 0.2px;
        }
        .note span {
            background: #eef3fa;
            padding: 0.1rem 0.6rem;
            border-radius: 24px;
        }
        @media (max-width: 450px) {
            .card { padding: 1.8rem 1.2rem; }
            .radio-group { gap: 0.8rem 0.5rem; padding: 0.6rem 0.8rem; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>📋 简单表单</h2>
        <div class="subhead">字段：id · 姓名 · 年龄 · sex · 邮箱</div>

        <form id="simpleForm" action="/do_add_user" method="POST">
            <!-- id -->
            <div class="form-group">
                <label for="userId"><i>🆔</i> id</label>
                <input type="text" id="userId" name="id" class="field" placeholder="例如：1001" required>
            </div>

            <!-- 姓名 -->
            <div class="form-group">
                <label for="name"><i>👤</i> 姓名</label>
                <input type="text" id="name" name="name" class="field" placeholder="例如：张明" required>
            </div>

            <!-- 年龄 -->
            <div class="form-group">
                <label for="age"><i>🔢</i> 年龄</label>
                <input type="number" id="age" name="age" class="field" placeholder="18 ~ 99" min="1" max="120" required>
            </div>

            <!-- sex (性别) -->
            <div class="form-group">
                <label style="margin-bottom: 10px;"><i>⚥</i> sex</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="sex" value="男" checked> 男
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="sex" value="女"> 女
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="sex" value="其他"> 其他
                    </label>
                </div>
            </div>

            <!-- 邮箱 -->
            <div class="form-group">
                <label for="email"><i>✉️</i> 邮箱</label>
                <input type="email" id="email" name="email" class="field" placeholder="name@example.com" required>
            </div>

            <button type="submit" class="btn-submit">
                <span>✓</span> 提交
            </button>
            <div class="note">
                <span>⏎ 纯展示 · 无脚本处理</span>
            </div>
        </form>
    </div>
</body>
</html>
